limit_req_zone $binary_remote_addr zone=mail_relay_captcha:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=mail_relay_verify:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mail_relay_public_refresh:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name temporary.yeqiu.loc.cc;

    client_max_body_size 2m;

    location = /static/public-mail.css {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /static/public-mail.js {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~ "^/[0-9a-fA-F-]{36}/captcha\.png$" {
        limit_req zone=mail_relay_captcha burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~ "^/[0-9a-fA-F-]{36}/verify$" {
        limit_req zone=mail_relay_verify burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~ "^/[0-9a-fA-F-]{36}/refresh$" {
        limit_req zone=mail_relay_public_refresh burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ~ "^/[0-9a-fA-F-]{36}(/refresh/[0-9a-fA-F]{32})?$" {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        return 404;
    }
}
