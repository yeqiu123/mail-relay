services:
  mail-relay:
    build: .
    container_name: mail-relay
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s

  mail-relay-worker:
    build: .
    container_name: mail-relay-worker
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      mail-relay:
        condition: service_healthy
